[profile.default]
src = "src"
out = "out"
libs = ["lib"]
allow_paths = ["lib"]
unchecked_cheatcode_artifacts = true
# solc = "0.8.33"
auto_detect_solc = true

# 默认关闭 via_ir，保证 Uniswap V2 Pair 字节码与 init code hash 一致
via_ir = false
optimizer = true
optimizer_runs = 200

# 仅对 src/ 下的自有合约启用 via_ir（可选，需要更高优化时）
additional_compiler_profiles = [
  { name = "via-ir", via_ir = true, optimizer = true, optimizer_runs = 200 }
]

compilation_restrictions = [
  { paths = "src/**", via_ir = true },
  { paths = "test/**", via_ir = true }
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

# 配置 RPC 节点别名
[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

# 配置 Etherscan API Key
[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
